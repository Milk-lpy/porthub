name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (go test / vet / race)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

      - name: Go test (race) — core/netd/relay/nftables
        run: go test -race -count=1 ./apps/core/ ./apps/netd/ ./apps/relay/ ./internal/nftables/

      - name: Verify binaries build via Makefile
        run: make build

  frontend:
    name: Frontend (typecheck / build)
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Production build
        run: npm run build

  shell:
    name: Shell scripts (bash -n)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check shell scripts
        run: |
          set -e
          for f in scripts/*.sh deploy/*.sh; do
            [ -f "$f" ] && bash -n "$f" && echo "OK $f"
          done
